services:
  kenku-web-remote:
    build: .
    # If you push the image to a registry instead of building in Portainer,
    # replace `build: .` above with e.g. `image: ghcr.io/dandamann/kenku-web-remote:latest`.
    container_name: kenku-web-remote
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Point this at the machine running Kenku FM. Use its LAN IP, e.g.
      # http://192.168.1.20:3333. Set KENKU_URL in the Portainer stack's
      # environment variables and it's substituted in below; the value after
      # ":-" is only the fallback if you don't set one. host.docker.internal
      # works if Kenku runs on the same host as Docker (wired up by extra_hosts).
      KENKU_URL: "${KENKU_URL:-http://host.docker.internal:3333}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
