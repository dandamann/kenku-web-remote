<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12101a" />
    <title>Kenku Remote</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>Kenku Remote</h1>
      <div class="actions">
        <span id="status" class="status" title="Connection status"></span>
        <button id="stopAll" class="stop-all" type="button">Stop all</button>
      </div>
    </header>

    <main id="boards" class="boards"></main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="/app.js"></script>
  </body>
</html>
